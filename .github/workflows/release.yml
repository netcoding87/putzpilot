name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm -C apps/renderer build

      - name: Build main process
        run: pnpm -C apps/main build

      - name: Build macOS arm64
        if: matrix.os == 'macos-latest'
        run: pnpm -C apps/main exec electron-builder --mac --arm64

      - name: Build macOS x64 (Intel)
        if: matrix.os == 'macos-latest'
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license
          pnpm -C apps/main exec electron-builder --mac --x64

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: pnpm -C apps/main exec electron-builder --win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: putzpilot-${{ matrix.os }}
          path: |
            apps/main/dist-electron/**/*.dmg
            apps/main/dist-electron/**/*.exe
            apps/main/dist-electron/**/*.blockmap

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
